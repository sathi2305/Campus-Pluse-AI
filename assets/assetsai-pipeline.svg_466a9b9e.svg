<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="CampusPulse AI pipeline in eight stages" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.float{animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.wf1{animation:wf 3s ease-in-out infinite}
.wf2{animation:wf 4.3s ease-in-out .8s infinite}
.wf3{animation:wf 2.4s ease-in-out 1.6s infinite}
@keyframes wf{0%,100%{opacity:.95}50%{opacity:.18}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
.col{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(.8)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a18"/><stop offset="1" stop-color="#0f1733"/></linearGradient>
<filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
</defs>
<rect width="1200" height="290" rx="24" fill="url(#bg)"/><rect width="1200" height="290" rx="24" fill="url(#grid)"/>
<path d="M90 136 H1105" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" fill="none"/>
